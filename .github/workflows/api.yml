name: API

on:
  push:
    branches: [main, develop]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas con pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: pytest

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pruebas
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t mandidog-api api

      - name: Probar /health en el contenedor
        run: |
          docker run -d --name mandidog -p 8000:8000 mandidog-api
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs mandidog
          exit 1
