name: App Android (APK)

on:
  push:
    branches: [main, develop]
    paths:
      - "mobile/**"
      - ".github/workflows/app-android.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Dirección predeterminada de la API dentro del APK (se puede cambiar desde la app)"
        required: false
        default: ""

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Analizar, probar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Compilar APK
        env:
          API_URL: ${{ github.event.inputs.api_url }}
        run: |
          if [ -n "$API_URL" ]; then
            flutter build apk --release --dart-define=API_URL="$API_URL"
          else
            flutter build apk --release
          fi

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mandidog-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
