name: App Android (APK) y web

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/app-android.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Opcional: usar la API en lugar del análisis en el teléfono (dirección de la API)"
        required: false
        default: ""

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Analizar, probar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test --reporter github

      - name: Compilar APK
        shell: bash
        env:
          API_URL: ${{ github.event.inputs.api_url }}
        run: |
          set -o pipefail
          # Un APK por tipo de procesador (64 y 32 bits) para que pese menos; x86_64 solo se usa en emuladores.
          OPCIONES="--release --split-per-abi --target-platform android-arm,android-arm64"
          if [ -n "$API_URL" ]; then
            flutter build apk $OPCIONES --dart-define=ANALISIS_EN_SERVIDOR=true --dart-define=API_URL="$API_URL" 2>&1 | tee salida-apk.txt
          else
            flutter build apk $OPCIONES 2>&1 | tee salida-apk.txt
          fi
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Detallar el error de compilación
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lineas = open("salida-apk.txt", encoding="utf-8", errors="replace").read().splitlines()
          claves = re.compile(r"^e: |error|wrong|failed|exception|missing|cannot|requires|incompatible|minSdk", re.I)
          utiles = [l.strip() for l in lineas if l.strip() and claves.search(l)]
          texto = " | ".join(dict.fromkeys(utiles))[:3800] or "Sin detalle en la salida"
          for i in range(0, len(texto), 1900):
              print("::error::" + texto[i:i + 1900].replace("%", "%25"))
          PY

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mandidog-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

  release:
    name: Publicar la versión (Release)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el APK compilado
        uses: actions/download-artifact@v4
        with:
          name: mandidog-apk

      - name: Crear la Release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          mv app-arm64-v8a-release.apk "MandiDog-IA-${ETIQUETA}.apk"
          mv app-armeabi-v7a-release.apk "MandiDog-IA-${ETIQUETA}-32bits.apk"
          cat > notas.md <<'NOTAS'
          ## Cómo instalar en Android

          1. Descarga desde el celular el archivo `MandiDog-IA-vX.Y.Z.apk` (sirve para casi todos los Android actuales). Solo si tu celular es muy antiguo y ese no se instala, usa el que termina en `-32bits.apk`.
          2. Ábrelo y, si Android lo pide, permite instalar apps de origen desconocido.
          3. Abre MandiDog IA y toma o elige una foto. El análisis se hace dentro del teléfono: no necesita internet ni un computador encendido.

          > Herramienta de apoyo. No reemplaza el diagnóstico de un médico veterinario.
          NOTAS
          gh release create "$ETIQUETA" "MandiDog-IA-${ETIQUETA}.apk" "MandiDog-IA-${ETIQUETA}-32bits.apk" --repo "$GITHUB_REPOSITORY" --title "MandiDog IA ${ETIQUETA}" --notes-file notas.md

  web:
    name: Pruebas en Chrome y compilación web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Pruebas en Chrome
        shell: bash
        run: |
          set -o pipefail
          flutter test --platform chrome --reporter expanded 2>&1 | tee salida-pruebas.txt

      - name: Detallar pruebas fallidas
        if: failure()
        run: |
          python3 - <<'PY'
          lineas = open("salida-pruebas.txt", encoding="utf-8", errors="replace").read().splitlines()
          bloques = []
          for i, linea in enumerate(lineas):
              if "[E]" in linea:
                  previas = [l.strip() for l in lineas[max(0, i - 40):i] if l.strip() and set(l.strip()) - set("═")]
                  previas = [l for l in previas if not l[:5].replace(":", "").isdigit()]
                  siguientes = [l.strip() for l in lineas[i + 1:i + 30] if l.strip() and set(l.strip()) - set("═")]
                  bloques.append(" | ".join(previas[-10:] + [linea.strip()] + siguientes))
          for bloque in bloques[:5] or ["Sin detalle en la salida"]:
              print("::error::" + bloque[:1800].replace("%", "%25"))
          PY

      - name: Compilar versión web
        run: flutter build web --release

      - name: Publicar la versión web como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mandidog-web
          path: mobile/build/web
          retention-days: 30
