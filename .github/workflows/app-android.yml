name: App Android (APK) y web

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/app-android.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Dirección predeterminada de la API dentro del APK (se puede cambiar desde la app)"
        required: false
        default: ""

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Analizar, probar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        run: flutter test --reporter github

      - name: Compilar APK
        env:
          API_URL: ${{ github.event.inputs.api_url }}
        run: |
          if [ -n "$API_URL" ]; then
            flutter build apk --release --dart-define=API_URL="$API_URL"
          else
            flutter build apk --release
          fi

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mandidog-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  release:
    name: Publicar la versión (Release)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el APK compilado
        uses: actions/download-artifact@v4
        with:
          name: mandidog-apk

      - name: Crear la Release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          mv app-release.apk "MandiDog-IA-${ETIQUETA}.apk"
          cat > notas.md <<'NOTAS'
          ## Cómo instalar en Android

          1. Descarga el archivo `.apk` de esta página desde el celular.
          2. Ábrelo y, si Android lo pide, permite instalar apps de origen desconocido.
          3. Abre MandiDog IA y toma o elige una foto. El análisis se hace dentro del teléfono: no necesita internet ni un computador encendido.

          > Herramienta de apoyo. No reemplaza el diagnóstico de un médico veterinario.
          NOTAS
          gh release create "$ETIQUETA" "MandiDog-IA-${ETIQUETA}.apk" --repo "$GITHUB_REPOSITORY" --title "MandiDog IA ${ETIQUETA}" --notes-file notas.md

  web:
    name: Pruebas en Chrome y compilación web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Pruebas en Chrome
        shell: bash
        run: |
          set -o pipefail
          flutter test --platform chrome --reporter expanded 2>&1 | tee salida-pruebas.txt

      - name: Detallar pruebas fallidas
        if: failure()
        run: |
          python3 - <<'PY'
          lineas = open("salida-pruebas.txt", encoding="utf-8", errors="replace").read().splitlines()
          bloques = []
          for i, linea in enumerate(lineas):
              if "[E]" in linea:
                  previas = [l.strip() for l in lineas[max(0, i - 40):i] if l.strip() and set(l.strip()) - set("═")]
                  previas = [l for l in previas if not l[:5].replace(":", "").isdigit()]
                  siguientes = [l.strip() for l in lineas[i + 1:i + 30] if l.strip() and set(l.strip()) - set("═")]
                  bloques.append(" | ".join(previas[-10:] + [linea.strip()] + siguientes))
          for bloque in bloques[:5] or ["Sin detalle en la salida"]:
              print("::error::" + bloque[:1800].replace("%", "%25"))
          PY

      - name: Compilar versión web
        run: flutter build web --release

      - name: Publicar la versión web como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mandidog-web
          path: mobile/build/web
          retention-days: 30
