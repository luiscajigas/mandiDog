<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Se reemplaza con el valor de --base-href al compilar. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MandiDog IA: cuida la boca de tu perro a tiempo. Orientación sobre posibles anomalías mandibulares; no reemplaza el diagnóstico veterinario.">
  <meta name="theme-color" content="#0F4C5C">

  <!-- iPhone: permite agregar la app a la pantalla de inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MandiDog">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MandiDog IA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FAF7F2; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #0F4C5C;
      transition: opacity .4s ease;
    }
    #carga img { width: 108px; height: 108px; animation: latido 1.4s ease-in-out infinite; }
    #carga p { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .3px; }
    @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0E1A1F; }
      #carga { color: #E6EEF0; }
    }
  </style>
</head>
<body>
  <div id="carga">
    <img src="icons/Icon-192.png" alt="">
    <p>Cargando MandiDog IA…</p>
  </div>
  <script>
    // Oculta la pantalla de carga cuando Flutter dibuja el primer cuadro.
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga');
      if (!carga) return;
      carga.style.opacity = '0';
      setTimeout(function () { carga.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
